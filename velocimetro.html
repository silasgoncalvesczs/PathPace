<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef2f6">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PathPace">
    <script>
        (function () {
            var tema = null
            try { tema = localStorage.getItem("pathpace:tema") } catch (e) {}
            if (tema !== "claro" && tema !== "escuro")
                tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro"
            document.documentElement.setAttribute("data-bs-theme", tema === "escuro" ? "dark" : "light")
            document.documentElement.setAttribute("data-tema", tema)
            document.querySelector('meta[name="theme-color"]')
                .setAttribute("content", tema === "escuro" ? "#0e141b" : "#eef2f6")
        })()
    </script>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/PathPace_logo.png" type="image/png">
    <link rel="apple-touch-icon" href="./assets/icones/apple-touch-icon.png">
    <title>PathPace - Nova corrida</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <link rel="stylesheet" href="./estilos.css">
</head>

<body>
    <div class="container aplicativo pagina-velocimetro">
        <header class="cabecalho">
            <a class="marca" href="./index.html">
                <img class="PathPaceLogo" src="./assets/PathPace_logo.png" alt="">
                <span>PathPace</span>
            </a>
            <div class="cabecalho-acoes">
                <button type="button" class="btn-icone" data-botao-tema aria-label="Mudar tema">
                    <i class="bi bi-moon-stars"></i>
                </button>
                <a class="btn-icone" href="./index.html" aria-label="Voltar ao histórico" title="Voltar">
                    <i class="bi bi-x-lg"></i>
                </a>
            </div>
        </header>

        <main class="painel-velocidade">
            <div class="painel-corpo">
                <span class="velocidade-valor" id="velocidade">0</span>
                <span class="velocidade-unidade">km/h</span>

                <div class="painel-metricas">
                    <div class="painel-metrica">
                        <span id="distancia">0.00</span>
                        <span>km</span>
                    </div>
                    <div class="painel-metrica">
                        <span id="duracao">00:00</span>
                        <span>tempo</span>
                    </div>
                </div>

                <div id="bloqueioStatus" class="painel-bloqueio" hidden></div>

                <div id="status" class="painel-status" role="status" aria-live="polite"></div>

                <p id="avisoArmazenamento" class="aviso-armazenamento" role="status" hidden></p>
            </div>

            <div class="painel-acoes">
                <button class="btn-acao btn-acao-iniciar" id="btnIniciar">Iniciar</button>
                <button class="btn-acao btn-acao-parar d-none" id="btnParar">Parar</button>
                <button class="btn-acao btn-acao-iniciar d-none" id="btnRetomar">Retomar corrida</button>
                <button class="btn-acao btn-acao-secundario d-none" id="btnEncerrarPendente">Salvar e encerrar</button>
            </div>
        </main>
    </div>

    <script src="./armazenamento.js"></script>
    <script src="./calculos.js"></script>
    <script src="./tema.js"></script>
    <script src="./interface.js"></script>
    <script src="./velocimetro.js"></script>
    <script src="./pwa.js"></script>
</body>

</html>
